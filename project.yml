name: Arpoon
options:
  bundleIdPrefix: dev.kevingyori
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  Arpoon:
    type: application
    platform: macOS
    sources:
      - Arpoon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kevingyori.Arpoon
        PRODUCT_NAME: Arpoon
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Arpoon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        DEVELOPMENT_TEAM: ""
  ArpoonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ArpoonTests
    dependencies:
      - target: Arpoon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
